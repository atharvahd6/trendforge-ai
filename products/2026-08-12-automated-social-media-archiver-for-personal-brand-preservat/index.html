<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Social Media Archiver</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #fff;
        }
        main {
            max-width: 800px;
            margin: 0 auto;
        }
        section {
            margin-bottom: 1em;
        }
        label {
            display: block;
            margin-bottom: 0.5em;
        }
        input, select {
            width: 100%;
            padding: 0.5em;
            margin-bottom: 1em;
            border: none;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            background-color: #555;
            color: #fff;
        }
        button {
            cursor: pointer;
            background-color: #555;
            color: #fff;
            padding: 0.5em 1em;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #666;
        }
        header {
            background-color: #2f2f2f;
            padding: 1em;
            text-align: center;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2em;
            background-color: #333;
        }
        section {
            background-color: #444;
            padding: 1em;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            width: 100%;
        }
        #lead-capture-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #lead-capture-modal > div {
            background-color: #444;
            padding: 1em;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Automated Social Media Archiver</h1>
    </header>
    <main>
        <section>
            <h2>Configure Your Archive</h2>
            <label for="social-media-platforms">Select Social Media Platforms:</label>
            <select id="social-media-platforms" multiple>
                <option value="facebook">Facebook</option>
                <option value="twitter">Twitter</option>
                <option value="instagram">Instagram</option>
                <option value="linkedin">LinkedIn</option>
            </select>
            <label for="archive-frequency">Archive Frequency:</label>
            <select id="archive-frequency">
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
            </select>
            <button id="save-config">Save Configuration</button>
        </section>
        <section>
            <h2>Analytics and Insights</h2>
            <p id="analytics">No data available.</p>
            <button id="export-archive">Export Archive</button>
        </section>
        <button id="learn-more">Learn More</button>
    </main>
    <div id="lead-capture-modal">
        <div>
            <h2>Get Started with Automated Social Media Archiver</h2>
            <label for="name">Name:</label>
            <input id="name" type="text">
            <label for="email">Email:</label>
            <input id="email" type="email">
            <button id="submit-lead">Submit</button>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const socialMediaPlatforms = document.getElementById('social-media-platforms');
            const archiveFrequency = document.getElementById('archive-frequency');
            const saveConfig = document.getElementById('save-config');
            const analytics = document.getElementById('analytics');
            const exportArchive = document.getElementById('export-archive');
            const learnMore = document.getElementById('learn-more');
            const leadCaptureModal = document.getElementById('lead-capture-modal');
            const name = document.getElementById('name');
            const email = document.getElementById('email');
            const submitLead = document.getElementById('submit-lead');

            saveConfig.addEventListener('click', () => {
                try {
                    const selectedPlatforms = Array.from(socialMediaPlatforms.selectedOptions).map(option => option.value);
                    const frequency = archiveFrequency.value;
                    localStorage.setItem('socialMediaPlatforms', JSON.stringify(selectedPlatforms));
                    localStorage.setItem('archiveFrequency', frequency);
                    alert('Configuration saved successfully!');
                } catch (error) {
                    console.error('Error saving configuration:', error);
                    alert('Failed to save configuration. Please try again.');
                }
            });

            exportArchive.addEventListener('click', () => {
                alert('Export functionality will be implemented soon.');
            });

            learnMore.addEventListener('click', () => {
                leadCaptureModal.style.display = 'flex';
            });

            submitLead.addEventListener('click', () => {
                if (!name.value.trim() || !email.value.trim()) {
                    alert('Please fill in all fields.');
                    return;
                }

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email.value)) {
                    alert('Please enter a valid email address.');
                    return;
                }

                const payload = {
                    productConcept: 'Automated Social Media Archiver',
                    name: name.value.trim(),
                    email: email.value.trim()
                };

                fetch('https://salarybit.in/api/v1/lead-intake', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    alert('Thank you for your interest! We will contact you soon.');
                    name.value = '';
                    email.value = '';
                    leadCaptureModal.style.display = 'none';
                })
                .catch(error => {
                    console.error('Error submitting lead:', error);
                    alert('Failed to submit your information. Please try again later.');
                });
            });

            try {
                const storedPlatforms = localStorage.getItem('socialMediaPlatforms');
                const storedFrequency = localStorage.getItem('archiveFrequency');
                if (storedPlatforms) {
                    const platforms = JSON.parse(storedPlatforms);
                    platforms.forEach(platform => {
                        const option = socialMediaPlatforms.querySelector(`option[value="${platform}"]`);
                        if (option) option.selected = true;
                    });
                }
                if (storedFrequency) {
                    archiveFrequency.value = storedFrequency;
                }
            } catch (error) {
                console.error('Error loading configuration:', error);
            }
        });
    </script>
</body>
</html>
