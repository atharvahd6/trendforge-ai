<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Duplicate Detector</title>
    <style>
        body {
            background-color: #2f2f2f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #4f4f4f;
            padding: 20px;
            text-align: center;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        section {
            background-color: #4f4f4f;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            width: 80%;
            max-width: 600px;
        }
        h1, h2 {
            margin-top: 0;
        }
        #file-input {
            padding: 10px;
            border: none;
            border-radius: 10px;
            background-color: #6f6f6f;
            color: #ffffff;
            margin-bottom: 10px;
        }
        #upload-button, #detect-button, #lead-capture-button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background-color: #8f8f8f;
            color: #ffffff;
            cursor: pointer;
            margin-top: 10px;
        }
        #lead-capture-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #4f4f4f;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            display: none;
            z-index: 1000;
        }
        #lead-capture-form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #lead-capture-form label {
            margin-bottom: 5px;
            width: 100%;
        }
        #lead-capture-form input {
            padding: 10px;
            border: none;
            border-radius: 10px;
            background-color: #6f6f6f;
            color: #ffffff;
            margin-bottom: 15px;
            width: 100%;
            box-sizing: border-box;
        }
        #submit-lead {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background-color: #8f8f8f;
            color: #ffffff;
            cursor: pointer;
        }
        #file-list, #duplicate-list {
            margin-top: 15px;
            word-break: break-all;
        }
        .error-message {
            color: #ff6b6b;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Digital Duplicate Detector</h1>
    </header>
    <main>
        <section>
            <h2>Upload Your Files</h2>
            <input type="file" id="file-input" multiple>
            <button id="upload-button">Upload</button>
            <div id="file-list"></div>
        </section>
        <section>
            <h2>Duplicate Detection</h2>
            <button id="detect-button">Detect Duplicates</button>
            <div id="duplicate-list"></div>
        </section>
        <section>
            <h2>Settings</h2>
            <label for="similarity-threshold">Similarity Threshold:</label>
            <input type="range" id="similarity-threshold" min="0" max="100" value="50">
            <span id="similarity-threshold-value">50%</span>
        </section>
    </main>
    <button id="lead-capture-button">Get Started</button>
    <div id="lead-capture-modal">
        <h2>Get Started with Digital Duplicate Detector</h2>
        <form id="lead-capture-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" required>
            <div id="lead-error" class="error-message" style="display: none;"></div>
            <button type="submit" id="submit-lead">Submit</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const fileInput = document.getElementById('file-input');
            const uploadButton = document.getElementById('upload-button');
            const fileList = document.getElementById('file-list');
            const detectButton = document.getElementById('detect-button');
            const duplicateList = document.getElementById('duplicate-list');
            const similarityThreshold = document.getElementById('similarity-threshold');
            const similarityThresholdValue = document.getElementById('similarity-threshold-value');
            const leadCaptureButton = document.getElementById('lead-capture-button');
            const leadCaptureModal = document.getElementById('lead-capture-modal');
            const leadCaptureForm = document.getElementById('lead-capture-form');
            const submitLead = document.getElementById('submit-lead');
            const leadError = document.getElementById('lead-error');

            let files = [];
            let fileHashes = new Map();

            // Safe localStorage access
            const safeLocalStorage = {
                getItem: (key) => {
                    try {
                        return localStorage.getItem(key);
                    } catch (e) {
                        console.error('localStorage access error:', e);
                        return null;
                    }
                },
                setItem: (key, value) => {
                    try {
                        localStorage.setItem(key, value);
                    } catch (e) {
                        console.error('localStorage access error:', e);
                    }
                }
            };

            // File hash calculation with error handling
            async function calculateHash(file) {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const hashBuffer = await crypto.subtle.digest('SHA-256', arrayBuffer);
                    const hashArray = Array.from(new Uint8Array(hashBuffer));
                    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                } catch (error) {
                    console.error('Error calculating hash:', error);
                    return null;
                }
            }

            fileInput.addEventListener('change', async (e) => {
                try {
                    files = Array.from(e.target.files);
                    fileList.innerHTML = '';
                    fileHashes.clear();

                    for (const file of files) {
                        const fileElement = document.createElement('div');
                        fileElement.textContent = file.name;
                        fileList.appendChild(fileElement);

                        const hash = await calculateHash(file);
                        if (hash) {
                            fileHashes.set(file, hash);
                        }
                    }

                    safeLocalStorage.setItem('files', JSON.stringify(files.map(f => ({
                        name: f.name,
                        size: f.size,
                        type: f.type,
                        lastModified: f.lastModified
                    }))));
                } catch (error) {
                    console.error('Error processing files:', error);
                    fileList.innerHTML = '<div class="error-message">Error processing files. Please try again.</div>';
                }
            });

            uploadButton.addEventListener('click', () => {
                fileInput.click();
            });

            detectButton.addEventListener('click', async () => {
                try {
                    if (files.length === 0) {
                        duplicateList.innerHTML = '<div class="error-message">No files uploaded. Please upload files first.</div>';
                        return;
                    }

                    if (fileHashes.size !== files.length) {
                        duplicateList.innerHTML = '<div class="error-message">Calculating hashes... Please wait and try again.</div>';
                        return;
                    }

                    const duplicates = [];
                    const hashGroups = new Map();

                    // Group files by hash
                    fileHashes.forEach((hash, file) => {
                        if (!hashGroups.has(hash)) {
                            hashGroups.set(hash, []);
                        }
                        hashGroups.get(hash).push(file);
                    });

                    // Find duplicates (hash groups with more than one file)
                    hashGroups.forEach((group, hash) => {
                        if (group.length > 1) {
                            for (let i = 0; i < group.length; i++) {
                                for (let j = i + 1; j < group.length; j++) {
                                    duplicates.push({
                                        file: group[i],
                                        duplicate: group[j]
                                    });
                                }
                            }
                        }
                    });

                    duplicateList.innerHTML = '';
                    if (duplicates.length === 0) {
                        duplicateList.innerHTML = '<div>No duplicates found.</div>';
                    } else {
                        duplicates.forEach((duplicate) => {
                            const duplicateElement = document.createElement('div');
                            duplicateElement.textContent = `${duplicate.file.name} is a duplicate of ${duplicate.duplicate.name}`;
                            duplicateList.appendChild(duplicateElement);
                        });
                    }
                } catch (error) {
                    console.error('Error detecting duplicates:', error);
                    duplicateList.innerHTML = '<div class="error-message">Error detecting duplicates. Please try again.</div>';
                }
            });

            similarityThreshold.addEventListener('input', (e) => {
                similarityThresholdValue.textContent = `${e.target.value}%`;
                safeLocalStorage.setItem('similarityThreshold', e.target.value);
            });

            leadCaptureButton.addEventListener('click', () => {
                leadCaptureModal.style.display = 'block';
                leadError.style.display = 'none';
            });

            leadCaptureForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                leadError.style.display = 'none';

                try {
                    const formData = new FormData(leadCaptureForm);
                    const leadData = {
                        name: formData.get('name'),
                        email: formData.get('email'),
                        phone: formData.get('phone'),
                        productConcept: 'Digital Duplicate Detector',
                    };

                    const response = await fetch('https://salarybit.in/api/v1/lead-intake', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(leadData),
                    });

                    if (!response.ok) {
                        throw new Error(`Server responded with status ${response.status}`);
                    }

                    const data = await response.json();
                    console.log('Lead submission successful:', data);
                    leadCaptureModal.style.display = 'none';
                    leadCaptureForm.reset();
                } catch (error) {
                    console.error('Error submitting lead:', error);
                    leadError.textContent = 'Error submitting form. Please try again.';
                    leadError.style.display = 'block';
                }
            });

            // Initialize from localStorage
            try {
                const storedFiles = safeLocalStorage.getItem('files');
                if (storedFiles) {
                    files = JSON.parse(storedFiles);
                    fileList.innerHTML = '';
                    files.forEach((file) => {
                        const fileElement = document.createElement('div');
                        fileElement.textContent = file.name;
                        fileList.appendChild(fileElement);
                    });
                }

                const storedSimilarityThreshold = safeLocalStorage.getItem('similarityThreshold');
                if (storedSimilarityThreshold) {
                    similarityThreshold.value = storedSimilarityThreshold;
                    similarityThresholdValue.textContent = `${storedSimilarityThreshold}%`;
                }
            } catch (error) {
                console.error('Error loading from localStorage:', error);
            }
        });
    </script>
</body>
</html>
