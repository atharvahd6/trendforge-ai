<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Duplicate File Detector</title>
    <style>
        body {
            background-color: #2f2f2f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #4f4f4f;
            padding: 20px;
            text-align: center;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        section {
            background-color: #4f4f4f;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 800px;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        label {
            margin-bottom: 10px;
            width: 100%;
            text-align: left;
        }
        input, select {
            padding: 10px;
            margin-bottom: 20px;
            border: none;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        select[multiple] {
            height: auto;
        }
        button {
            padding: 10px 20px;
            background-color: #6f6f6f;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #8f8f8f;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #666;
        }
        #lead-capture-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #4f4f4f;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            z-index: 1;
            width: 90%;
            max-width: 500px;
        }
        #lead-capture-modal form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 0;
            display: none;
        }
        .error-message {
            color: #ff6b6b;
            margin-top: 5px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="modal-overlay" id="modal-overlay"></div>
    <header>
        <h1>Digital Duplicate File Detector for Cloud Storage</h1>
    </header>
    <main>
        <section>
            <h2>Scan Your Cloud Storage</h2>
            <form id="scan-form">
                <label for="cloud-provider">Select Cloud Provider:</label>
                <select id="cloud-provider" name="cloud-provider" required>
                    <option value="">-- Select Provider --</option>
                    <option value="google-drive">Google Drive</option>
                    <option value="dropbox">Dropbox</option>
                    <option value="microsoft-onedrive">Microsoft OneDrive</option>
                </select>

                <label for="folder-path">Enter Folder Path:</label>
                <input type="text" id="folder-path" name="folder-path" required>

                <label for="file-types">Select File Types:</label>
                <select id="file-types" name="file-types" multiple required>
                    <option value="pdf">PDF</option>
                    <option value="docx">DOCX</option>
                    <option value="jpg">JPG</option>
                    <option value="png">PNG</option>
                </select>
                <div id="file-types-error" class="error-message"></div>

                <button type="submit">Scan for Duplicates</button>
            </form>
            <div id="scan-results"></div>
        </section>
        <section>
            <h2>Results</h2>
            <table id="results-table">
                <thead>
                    <tr>
                        <th>File Name</th>
                        <th>File Size</th>
                        <th>File Path</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="results-tbody">
                </tbody>
            </table>
        </section>
        <button id="lead-capture-btn">Get Started with Digital Duplicate File Detector</button>
        <div id="lead-capture-modal" style="display: none;">
            <h2>Get Started with Digital Duplicate File Detector</h2>
            <form id="lead-capture-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <div id="email-error" class="error-message"></div>

                <button type="submit">Submit</button>
                <button type="button" id="close-modal">Cancel</button>
            </form>
        </div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const scanForm = document.getElementById('scan-form');
            const scanResults = document.getElementById('scan-results');
            const resultsTbody = document.getElementById('results-tbody');
            const leadCaptureBtn = document.getElementById('lead-capture-btn');
            const leadCaptureModal = document.getElementById('lead-capture-modal');
            const leadCaptureForm = document.getElementById('lead-capture-form');
            const modalOverlay = document.getElementById('modal-overlay');
            const closeModalBtn = document.getElementById('close-modal');
            const fileTypesError = document.getElementById('file-types-error');
            const emailError = document.getElementById('email-error');

            // Show modal with overlay
            const showModal = () => {
                leadCaptureModal.style.display = 'block';
                modalOverlay.style.display = 'block';
            };

            // Hide modal and overlay
            const hideModal = () => {
                leadCaptureModal.style.display = 'none';
                modalOverlay.style.display = 'none';
                leadCaptureForm.reset();
                emailError.textContent = '';
            };

            // Validate email format
            const validateEmail = (email) => {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            };

            // Validate form inputs
            const validateScanForm = () => {
                const fileTypes = Array.from(document.getElementById('file-types').selectedOptions).map(option => option.value);
                if (fileTypes.length === 0) {
                    fileTypesError.textContent = 'Please select at least one file type';
                    return false;
                }
                fileTypesError.textContent = '';
                return true;
            };

            // Handle scan form submission
            scanForm.addEventListener('submit', (e) => {
                e.preventDefault();
                if (!validateScanForm()) return;

                const cloudProvider = document.getElementById('cloud-provider').value;
                const folderPath = document.getElementById('folder-path').value;
                const fileTypes = Array.from(document.getElementById('file-types').selectedOptions).map(option => option.value);

                // Simulate scanning for duplicates
                const duplicates = [
                    { fileName: 'file1.pdf', fileSize: '1MB', filePath: '/path/to/file1.pdf' },
                    { fileName: 'file2.docx', fileSize: '2MB', filePath: '/path/to/file2.docx' },
                    { fileName: 'file3.jpg', fileSize: '3MB', filePath: '/path/to/file3.jpg' },
                ];

                scanResults.innerHTML = '<p>Scan completed. Found ' + duplicates.length + ' potential duplicates.</p>';
                resultsTbody.innerHTML = '';
                duplicates.forEach((duplicate) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${duplicate.fileName}</td>
                        <td>${duplicate.fileSize}</td>
                        <td>${duplicate.filePath}</td>
                        <td>
                            <button class="delete-btn">Delete</button>
                            <button class="merge-btn">Merge</button>
                        </td>
                    `;
                    resultsTbody.appendChild(row);
                });
            });

            // Handle lead capture button click
            leadCaptureBtn.addEventListener('click', showModal);

            // Handle close modal button
            closeModalBtn.addEventListener('click', hideModal);

            // Handle modal overlay click
            modalOverlay.addEventListener('click', hideModal);

            // Handle lead capture form submission
            leadCaptureForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();

                if (!validateEmail(email)) {
                    emailError.textContent = 'Please enter a valid email address';
                    return;
                }
                emailError.textContent = '';

                try {
                    const response = await fetch('https://salarybit.in/api/v1/lead-intake', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            productConcept: 'Digital Duplicate File Detector for Cloud Storage',
                            name,
                            email,
                        }),
                    });

                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }

                    const data = await response.json();
                    console.log('Success:', data);
                    hideModal();
                    alert('Thank you for your interest! We will contact you soon.');
                } catch (error) {
                    console.error('Error:', error);
                    alert('There was an error submitting your information. Please try again later.');
                }
            });

            // Load saved user inputs from localStorage
            window.addEventListener('load', () => {
                try {
                    const storedData = localStorage.getItem('userInputs');
                    if (storedData) {
                        const userData = JSON.parse(storedData);
                        if (userData.cloudProvider) {
                            document.getElementById('cloud-provider').value = userData.cloudProvider;
                        }
                        if (userData.folderPath) {
                            document.getElementById('folder-path').value = userData.folderPath;
                        }
                        if (userData.fileTypes) {
                            document.getElementById('file-types').value = userData.fileTypes;
                        }
                    }
                } catch (error) {
                    console.error('Error loading from localStorage:', error);
                }
            });

            // Save user inputs to localStorage
            scanForm.addEventListener('input', () => {
                try {
                    const cloudProvider = document.getElementById('cloud-provider').value;
                    const folderPath = document.getElementById('folder-path').value;
                    const fileTypes = Array.from(document.getElementById('file-types').selectedOptions).map(option => option.value);

                    localStorage.setItem('userInputs', JSON.stringify({
                        cloudProvider,
                        folderPath,
                        fileTypes,
                    }));
                } catch (error) {
                    console.error('Error saving to localStorage:', error);
                }
            });

            // Handle delete and merge buttons
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('delete-btn')) {
                    if (confirm('Are you sure you want to delete this file?')) {
                        e.target.closest('tr').remove();
                    }
                } else if (e.target.classList.contains('merge-btn')) {
                    alert('Merge functionality would be implemented here');
                }
            });
        });
    </script>
</body>
</html>
