<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Podcast Transcript Summarizer</title>
    <style>
        body {
            background-color: #333;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        main {
            max-width: 800px;
            margin: 2em auto;
            padding: 1em;
            background-color: #444;
            color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #transcript, #summary {
            width: 100%;
            font-family: monospace;
            padding: 1em;
            margin-bottom: 1em;
            border: none;
            border-radius: 10px;
            background-color: #555;
            color: #fff;
            box-sizing: border-box;
        }
        #summary {
            height: auto;
            min-height: 100px;
        }
        #transcript {
            height: 200px;
        }
        button {
            background-color: #666;
            color: #fff;
            border: none;
            padding: 1em;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 1em;
            width: 100%;
            max-width: 300px;
        }
        button:hover {
            background-color: #777;
        }
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #modal > div {
            background-color: #444;
            color: #fff;
            padding: 1em;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 500px;
        }
        #lead-form {
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        #lead-form label {
            margin-bottom: 0.5em;
            text-align: left;
        }
        #lead-form input {
            width: 100%;
            padding: 1em;
            margin-bottom: 1em;
            border: none;
            border-radius: 10px;
            background-color: #555;
            color: #fff;
            box-sizing: border-box;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 1em;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>AI-Powered Podcast Transcript Summarizer</h1>
    </header>
    <main>
        <h2>Summarize Your Podcast Transcript</h2>
        <textarea id="transcript" placeholder="Enter your podcast transcript"></textarea>
        <button id="summarize">Summarize</button>
        <button id="save">Save</button>
        <button id="lead-capture">Get Started</button>
        <div id="summary"></div>
    </main>
    <div id="modal">
        <div>
            <h2>Get Started with AI-Powered Podcast Transcript Summarizer</h2>
            <form id="lead-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const transcript = document.getElementById('transcript');
            const summarize = document.getElementById('summarize');
            const save = document.getElementById('save');
            const leadCapture = document.getElementById('lead-capture');
            const summary = document.getElementById('summary');
            const modal = document.getElementById('modal');
            const leadForm = document.getElementById('lead-form');

            if (!transcript || !summarize || !save || !leadCapture || !summary || !modal || !leadForm) {
                console.error('One or more required elements not found');
                return;
            }

            summarize.addEventListener('click', () => {
                try {
                    const text = transcript.value.trim();
                    if (!text) {
                        summary.textContent = 'Please enter a transcript to summarize.';
                        return;
                    }
                    summary.textContent = text.substring(0, 200) + (text.length > 200 ? '...' : '');
                } catch (error) {
                    console.error('Error summarizing transcript:', error);
                    summary.textContent = 'An error occurred while summarizing.';
                }
            });

            save.addEventListener('click', () => {
                try {
                    const text = transcript.value.trim();
                    if (!text) {
                        alert('Please enter a transcript to save.');
                        return;
                    }
                    localStorage.setItem('transcript', text);
                    alert('Transcript saved successfully!');
                } catch (error) {
                    console.error('Error saving transcript:', error);
                    if (error.name === 'QuotaExceededError') {
                        alert('Storage limit exceeded. Please clear some data and try again.');
                    } else {
                        alert('An error occurred while saving.');
                    }
                }
            });

            leadCapture.addEventListener('click', () => {
                modal.style.display = 'flex';
            });

            leadForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                try {
                    const name = document.getElementById('name').value.trim();
                    const email = document.getElementById('email').value.trim();

                    if (!name || !email) {
                        alert('Please fill in all fields.');
                        return;
                    }

                    const payload = {
                        product: 'AI-Powered Podcast Transcript Summarizer',
                        name,
                        email
                    };

                    const response = await fetch('https://salarybit.in/api/v1/lead-intake', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    console.log('Lead submission successful:', data);
                    alert('Thank you for your interest! We will be in touch soon.');
                    modal.style.display = 'none';
                    leadForm.reset();
                } catch (error) {
                    console.error('Error submitting lead:', error);
                    alert('An error occurred while submitting your information. Please try again later.');
                }
            });

            window.addEventListener('load', () => {
                try {
                    const storedTranscript = localStorage.getItem('transcript');
                    if (storedTranscript) {
                        transcript.value = storedTranscript;
                    }
                } catch (error) {
                    console.error('Error loading saved transcript:', error);
                }
            });
        });
    </script>
</body>
</html>
