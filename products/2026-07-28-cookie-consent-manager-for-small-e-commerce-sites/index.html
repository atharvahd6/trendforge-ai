<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Consent Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #333;
            margin: 0;
            padding: 0;
        }
        main {
            color: #fff;
            max-width: 800px;
            margin: 2em auto;
            padding: 1em;
            background-color: #444;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 1em;
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 0.5em;
        }
        input, select, textarea {
            width: 100%;
            padding: 0.5em;
            margin-bottom: 1em;
            border: none;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }
        button {
            background-color: #555;
            color: #fff;
            border: none;
            padding: 1em;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 0.5em;
        }
        button:hover {
            background-color: #666;
        }
        #lead-capture-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #lead-capture-modal > div {
            background-color: #444;
            color: #fff;
            padding: 1em;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Cookie Consent Manager</h1>
    </header>
    <main>
        <h2>Manage Cookie Consent for Your E-commerce Site</h2>
        <form id="cookie-consent-form">
            <label for="site-url">Enter your e-commerce site URL:</label>
            <input type="url" id="site-url" name="site-url" required>

            <label for="cookie-category">Select cookie category:</label>
            <select id="cookie-category" name="cookie-category">
                <option value="necessary">Necessary</option>
                <option value="preferences">Preferences</option>
                <option value="statistics">Statistics</option>
                <option value="marketing">Marketing</option>
            </select>

            <label for="consent-banner">Customize consent banner:</label>
            <textarea id="consent-banner" name="consent-banner"></textarea>

            <button type="submit">Save Changes</button>
        </form>
        <button id="lead-capture-btn">Get Started</button>
        <div id="lead-capture-modal">
            <div>
                <h2>Get Started with Cookie Consent Manager</h2>
                <form id="lead-capture-form">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <button type="submit">Submit</button>
                </form>
            </div>
        </div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('cookie-consent-form');
            const leadCaptureBtn = document.getElementById('lead-capture-btn');
            const leadCaptureModal = document.getElementById('lead-capture-modal');
            const leadCaptureForm = document.getElementById('lead-capture-form');

            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    try {
                        const siteUrl = document.getElementById('site-url').value;
                        const cookieCategory = document.getElementById('cookie-category').value;
                        const consentBanner = document.getElementById('consent-banner').value;

                        if (typeof localStorage !== 'undefined') {
                            localStorage.setItem('siteUrl', siteUrl);
                            localStorage.setItem('cookieCategory', cookieCategory);
                            localStorage.setItem('consentBanner', consentBanner);
                        }
                    } catch (error) {
                        console.error('Error saving form data:', error);
                    }
                });
            }

            if (leadCaptureBtn && leadCaptureModal) {
                leadCaptureBtn.addEventListener('click', () => {
                    leadCaptureModal.style.display = 'flex';
                });
            }

            if (leadCaptureForm) {
                leadCaptureForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    try {
                        const name = document.getElementById('name').value;
                        const email = document.getElementById('email').value;

                        const payload = {
                            productConcept: 'Cookie Consent Manager',
                            name,
                            email
                        };

                        if (typeof fetch !== 'undefined') {
                            try {
                                const response = await fetch('https://salarybit.in/api/v1/lead-intake', {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify(payload)
                                });

                                if (!response.ok) {
                                    throw new Error(`HTTP error! status: ${response.status}`);
                                }

                                const data = await response.json();
                                console.log('Success:', data);
                            } catch (error) {
                                console.error('Error submitting lead:', error);
                            }
                        }
                    } catch (error) {
                        console.error('Error processing lead form:', error);
                    } finally {
                        leadCaptureModal.style.display = 'none';
                    }
                });
            }

            try {
                if (typeof localStorage !== 'undefined') {
                    const siteUrl = localStorage.getItem('siteUrl');
                    const cookieCategory = localStorage.getItem('cookieCategory');
                    const consentBanner = localStorage.getItem('consentBanner');

                    if (siteUrl) {
                        document.getElementById('site-url').value = siteUrl;
                    }
                    if (cookieCategory) {
                        document.getElementById('cookie-category').value = cookieCategory;
                    }
                    if (consentBanner) {
                        document.getElementById('consent-banner').value = consentBanner;
                    }
                }
            } catch (error) {
                console.error('Error loading saved data:', error);
            }
        });
    </script>
</body>
</html>
