<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Personal Knowledge Graph Builder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #2f2f2f;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        main {
            background-color: #4f4f4f;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        section {
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #7f7f7f;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #6f6f6f;
        }
        #lead-capture-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #lead-capture-modal > div {
            background-color: #2f2f2f;
            color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 500px;
        }
        input {
            width: 100%;
            height: 40px;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <header>
        <h1>AI-Powered Personal Knowledge Graph Builder</h1>
    </header>
    <main>
        <section>
            <h2>Enter Your Notes and Research</h2>
            <textarea id="notes" placeholder="Enter your notes here..."></textarea>
        </section>
        <section>
            <h2>Enter Your Bookmarks</h2>
            <textarea id="bookmarks" placeholder="Enter your bookmarks here..."></textarea>
        </section>
        <section>
            <h2>Enter Your Research Papers</h2>
            <textarea id="research-papers" placeholder="Enter your research papers here..."></textarea>
        </section>
        <button id="build-graph">Build Knowledge Graph</button>
        <button id="export-graph">Export Knowledge Graph</button>
        <button id="share-graph">Share Knowledge Graph</button>
        <button id="get-started">Get Started</button>
    </main>
    <div id="lead-capture-modal">
        <div>
            <h2>Get Started with AI-Powered Personal Knowledge Graph Builder</h2>
            <input id="name" type="text" placeholder="Name" required>
            <input id="email" type="email" placeholder="Email" required>
            <button id="submit-lead">Submit</button>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const notes = document.getElementById('notes');
            const bookmarks = document.getElementById('bookmarks');
            const researchPapers = document.getElementById('research-papers');
            const buildGraph = document.getElementById('build-graph');
            const exportGraph = document.getElementById('export-graph');
            const shareGraph = document.getElementById('share-graph');
            const getStarted = document.getElementById('get-started');
            const leadCaptureModal = document.getElementById('lead-capture-modal');
            const name = document.getElementById('name');
            const email = document.getElementById('email');
            const submitLead = document.getElementById('submit-lead');

            // Load saved data from localStorage
            try {
                if (localStorage.getItem('notes')) {
                    notes.value = localStorage.getItem('notes');
                }
                if (localStorage.getItem('bookmarks')) {
                    bookmarks.value = localStorage.getItem('bookmarks');
                }
                if (localStorage.getItem('researchPapers')) {
                    researchPapers.value = localStorage.getItem('researchPapers');
                }
            } catch (e) {
                console.error('Error accessing localStorage:', e);
            }

            buildGraph.addEventListener('click', () => {
                try {
                    const notesValue = notes.value;
                    const bookmarksValue = bookmarks.value;
                    const researchPapersValue = researchPapers.value;

                    localStorage.setItem('notes', notesValue);
                    localStorage.setItem('bookmarks', bookmarksValue);
                    localStorage.setItem('researchPapers', researchPapersValue);

                    alert('Knowledge graph built successfully!');
                } catch (e) {
                    console.error('Error saving to localStorage:', e);
                    alert('Error building knowledge graph. Please try again.');
                }
            });

            exportGraph.addEventListener('click', () => {
                try {
                    const notesValue = localStorage.getItem('notes') || '';
                    const bookmarksValue = localStorage.getItem('bookmarks') || '';
                    const researchPapersValue = localStorage.getItem('researchPapers') || '';

                    const graphData = {
                        notes: notesValue,
                        bookmarks: bookmarksValue,
                        researchPapers: researchPapersValue
                    };

                    console.log('Exported graph data:', graphData);
                    alert('Knowledge graph exported successfully! Check console for details.');
                } catch (e) {
                    console.error('Error exporting graph:', e);
                    alert('Error exporting knowledge graph. Please try again.');
                }
            });

            shareGraph.addEventListener('click', () => {
                try {
                    const notesValue = localStorage.getItem('notes') || '';
                    const bookmarksValue = localStorage.getItem('bookmarks') || '';
                    const researchPapersValue = localStorage.getItem('researchPapers') || '';

                    const graphData = {
                        notes: notesValue,
                        bookmarks: bookmarksValue,
                        researchPapers: researchPapersValue
                    };

                    console.log('Shared graph data:', graphData);
                    alert('Knowledge graph data is ready to share. Check console for details.');
                } catch (e) {
                    console.error('Error preparing graph for sharing:', e);
                    alert('Error preparing knowledge graph for sharing. Please try again.');
                }
            });

            getStarted.addEventListener('click', () => {
                leadCaptureModal.style.display = 'flex';
            });

            submitLead.addEventListener('click', async () => {
                const nameValue = name.value.trim();
                const emailValue = email.value.trim();

                if (!nameValue || !emailValue) {
                    alert('Please fill in all fields');
                    return;
                }

                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailValue)) {
                    alert('Please enter a valid email address');
                    return;
                }

                const leadData = {
                    name: nameValue,
                    email: emailValue,
                    productConcept: 'AI-Powered Personal Knowledge Graph Builder'
                };

                try {
                    const response = await fetch('https://salarybit.in/api/v1/lead-intake', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(leadData)
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    console.log('Lead submission successful:', data);
                    alert('Thank you for your interest! We will contact you soon.');
                    name.value = '';
                    email.value = '';
                    leadCaptureModal.style.display = 'none';
                } catch (error) {
                    console.error('Error submitting lead:', error);
                    alert('Error submitting your information. Please try again later.');
                }
            });

            // Close modal when clicking outside
            leadCaptureModal.addEventListener('click', (e) => {
                if (e.target === leadCaptureModal) {
                    leadCaptureModal.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
