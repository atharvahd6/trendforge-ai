<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unused Digital Asset Organizer</title>
    <style>
        body {
            background-color: #2f2f2f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #4f4f4f;
            padding: 20px;
            text-align: center;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        section {
            background-color: #4f4f4f;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
        }
        h1, h2 {
            margin-top: 0;
        }
        input, select, button {
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 5px;
            background-color: #6f6f6f;
            color: #ffffff;
            width: 100%;
            box-sizing: border-box;
        }
        input:focus, select:focus, button:focus {
            outline: none;
            background-color: #8f8f8f;
        }
        button {
            cursor: pointer;
        }
        #lead-capture-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #4f4f4f;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            display: none;
            width: 90%;
            max-width: 400px;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 1000;
        }
        .error-message {
            color: #ff6b6b;
            margin-top: 5px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="modal-overlay" id="modal-overlay"></div>
    <header>
        <h1>Unused Digital Asset Organizer</h1>
    </header>
    <main>
        <section>
            <h2>Discover Your Unused Digital Assets</h2>
            <input type="text" id="asset-path" placeholder="Enter asset path">
            <button id="discover-btn">Discover</button>
            <div id="asset-list"></div>
        </section>
        <section>
            <h2>Categorize Your Digital Assets</h2>
            <select id="asset-type">
                <option value="">Select asset type</option>
                <option value="image">Image</option>
                <option value="video">Video</option>
                <option value="audio">Audio</option>
            </select>
            <input type="text" id="asset-tag" placeholder="Enter asset tag">
            <button id="categorize-btn">Categorize</button>
            <div id="categorized-assets"></div>
        </section>
        <section>
            <h2>Prioritize Your Digital Assets</h2>
            <input type="number" id="asset-priority" placeholder="Enter asset priority" min="1" max="10">
            <button id="prioritize-btn">Prioritize</button>
            <div id="prioritized-assets"></div>
        </section>
        <button id="lead-capture-btn">Get Started with Unused Digital Asset Organizer</button>
        <div id="lead-capture-modal">
            <h2>Get Started with Unused Digital Asset Organizer</h2>
            <input type="text" id="name" placeholder="Enter your name">
            <div id="name-error" class="error-message"></div>
            <input type="email" id="email" placeholder="Enter your email">
            <div id="email-error" class="error-message"></div>
            <button id="submit-lead">Submit</button>
        </div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const assetPathInput = document.getElementById('asset-path');
            const discoverBtn = document.getElementById('discover-btn');
            const assetList = document.getElementById('asset-list');
            const assetTypeSelect = document.getElementById('asset-type');
            const assetTagInput = document.getElementById('asset-tag');
            const categorizeBtn = document.getElementById('categorize-btn');
            const categorizedAssets = document.getElementById('categorized-assets');
            const assetPriorityInput = document.getElementById('asset-priority');
            const prioritizeBtn = document.getElementById('prioritize-btn');
            const prioritizedAssets = document.getElementById('prioritized-assets');
            const leadCaptureBtn = document.getElementById('lead-capture-btn');
            const leadCaptureModal = document.getElementById('lead-capture-modal');
            const modalOverlay = document.getElementById('modal-overlay');
            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const submitLeadBtn = document.getElementById('submit-lead');
            const nameError = document.getElementById('name-error');
            const emailError = document.getElementById('email-error');

            function showModal() {
                leadCaptureModal.style.display = 'block';
                modalOverlay.style.display = 'block';
            }

            function hideModal() {
                leadCaptureModal.style.display = 'none';
                modalOverlay.style.display = 'none';
                nameError.textContent = '';
                emailError.textContent = '';
            }

            function validateEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }

            discoverBtn.addEventListener('click', () => {
                const assetPath = assetPathInput.value.trim();
                if (!assetPath) {
                    assetList.innerHTML = '<p style="color: #ff6b6b;">Please enter a valid asset path</p>';
                    return;
                }
                try {
                    localStorage.setItem('assetPath', assetPath);
                    assetList.innerHTML = `Discovering assets at ${assetPath}...`;
                } catch (e) {
                    assetList.innerHTML = '<p style="color: #ff6b6b;">Error saving asset path. Please try again.</p>';
                    console.error('LocalStorage error:', e);
                }
            });

            categorizeBtn.addEventListener('click', () => {
                const assetType = assetTypeSelect.value;
                const assetTag = assetTagInput.value.trim();

                if (!assetType) {
                    categorizedAssets.innerHTML = '<p style="color: #ff6b6b;">Please select an asset type</p>';
                    return;
                }

                if (!assetTag) {
                    categorizedAssets.innerHTML = '<p style="color: #ff6b6b;">Please enter an asset tag</p>';
                    return;
                }

                try {
                    localStorage.setItem('assetType', assetType);
                    localStorage.setItem('assetTag', assetTag);
                    categorizedAssets.innerHTML = `Categorizing assets as ${assetType} with tag ${assetTag}...`;
                } catch (e) {
                    categorizedAssets.innerHTML = '<p style="color: #ff6b6b;">Error saving categorization. Please try again.</p>';
                    console.error('LocalStorage error:', e);
                }
            });

            prioritizeBtn.addEventListener('click', () => {
                const assetPriority = assetPriorityInput.value.trim();

                if (!assetPriority || isNaN(assetPriority) || assetPriority < 1 || assetPriority > 10) {
                    prioritizedAssets.innerHTML = '<p style="color: #ff6b6b;">Please enter a valid priority (1-10)</p>';
                    return;
                }

                try {
                    localStorage.setItem('assetPriority', assetPriority);
                    prioritizedAssets.innerHTML = `Prioritizing assets with priority ${assetPriority}...`;
                } catch (e) {
                    prioritizedAssets.innerHTML = '<p style="color: #ff6b6b;">Error saving priority. Please try again.</p>';
                    console.error('LocalStorage error:', e);
                }
            });

            leadCaptureBtn.addEventListener('click', showModal);

            modalOverlay.addEventListener('click', hideModal);

            submitLeadBtn.addEventListener('click', () => {
                const name = nameInput.value.trim();
                const email = emailInput.value.trim();
                let isValid = true;

                nameError.textContent = '';
                emailError.textContent = '';

                if (!name) {
                    nameError.textContent = 'Name is required';
                    isValid = false;
                }

                if (!email) {
                    emailError.textContent = 'Email is required';
                    isValid = false;
                } else if (!validateEmail(email)) {
                    emailError.textContent = 'Please enter a valid email address';
                    isValid = false;
                }

                if (!isValid) return;

                const payload = {
                    productConcept: 'Unused Digital Asset Organizer',
                    name,
                    email
                };

                submitLeadBtn.disabled = true;
                submitLeadBtn.textContent = 'Submitting...';

                fetch('https://salarybit.in/api/v1/lead-intake', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    alert('Thank you for your interest! We will contact you soon.');
                    nameInput.value = '';
                    emailInput.value = '';
                    hideModal();
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('There was an error submitting your information. Please try again.');
                })
                .finally(() => {
                    submitLeadBtn.disabled = false;
                    submitLeadBtn.textContent = 'Submit';
                });
            });

            window.addEventListener('load', () => {
                try {
                    const assetPath = localStorage.getItem('assetPath');
                    const assetType = localStorage.getItem('assetType');
                    const assetTag = localStorage.getItem('assetTag');
                    const assetPriority = localStorage.getItem('assetPriority');

                    if (assetPath) assetPathInput.value = assetPath;
                    if (assetType) assetTypeSelect.value = assetType;
                    if (assetTag) assetTagInput.value = assetTag;
                    if (assetPriority) assetPriorityInput.value = assetPriority;
                } catch (e) {
                    console.error('LocalStorage error:', e);
                }
            });
        });
    </script>
</body>
</html>
