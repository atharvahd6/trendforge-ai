<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Social Media Archiver</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            margin: 0;
            padding: 0;
        }
        label {
            display: block;
            margin-bottom: 0.5em;
        }
        select, input[type="text"], input[type="email"] {
            width: 100%;
            padding: 0.5em;
            margin-bottom: 1em;
            border: none;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
        button {
            background-color: #666;
            color: #fff;
            padding: 0.5em 1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 0.5em;
        }
        button:hover {
            background-color: #777;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 1em;
            text-align: center;
        }
        main {
            max-width: 800px;
            margin: 2em auto;
            padding: 1em;
            background-color: #444;
            color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
        #lead-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #lead-modal > div {
            background-color: #444;
            color: #fff;
            padding: 1em;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Automated Social Media Archiver</h1>
    </header>
    <main>
        <h2>Configure Your Archiver</h2>
        <form id="archiver-form">
            <label for="platforms">Select Social Media Platforms:</label>
            <select id="platforms" multiple>
                <option value="facebook">Facebook</option>
                <option value="twitter">Twitter</option>
                <option value="instagram">Instagram</option>
            </select>
            <br>
            <label for="schedule">Archiving Schedule:</label>
            <select id="schedule">
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
            </select>
            <br>
            <label for="tags">Content Tags:</label>
            <input type="text" id="tags" placeholder="Separate tags with commas">
            <br>
            <button type="button" id="save-config">Save Configuration</button>
        </form>
        <button type="button" id="lead-capture">Get Started</button>
        <div id="lead-modal">
            <div>
                <h2>Get Started with Automated Social Media Archiver</h2>
                <form id="lead-form">
                    <label for="name">Name:</label>
                    <input type="text" id="name" required>
                    <br>
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                    <br>
                    <button type="button" id="submit-lead">Submit</button>
                </form>
            </div>
        </div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const archiverForm = document.getElementById('archiver-form');
            const saveConfigButton = document.getElementById('save-config');
            const leadCaptureButton = document.getElementById('lead-capture');
            const leadModal = document.getElementById('lead-modal');
            const leadForm = document.getElementById('lead-form');
            const submitLeadButton = document.getElementById('submit-lead');

            if (saveConfigButton) {
                saveConfigButton.addEventListener('click', () => {
                    try {
                        const platforms = document.getElementById('platforms').selectedOptions;
                        const schedule = document.getElementById('schedule').value;
                        const tags = document.getElementById('tags').value;
                        const config = {
                            platforms: Array.from(platforms).map(option => option.value),
                            schedule,
                            tags
                        };
                        localStorage.setItem('archiver-config', JSON.stringify(config));
                        alert('Configuration saved successfully!');
                    } catch (error) {
                        console.error('Error saving configuration:', error);
                        alert('Failed to save configuration. Please try again.');
                    }
                });
            }

            if (leadCaptureButton) {
                leadCaptureButton.addEventListener('click', () => {
                    leadModal.style.display = 'flex';
                });
            }

            if (submitLeadButton) {
                submitLeadButton.addEventListener('click', () => {
                    const name = document.getElementById('name').value;
                    const email = document.getElementById('email').value;

                    if (!name || !email) {
                        alert('Please fill in all required fields.');
                        return;
                    }

                    const lead = {
                        name,
                        email,
                        product: 'Automated Social Media Archiver'
                    };

                    fetch('https://salarybit.in/api/v1/lead-intake', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(lead)
                    })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(data => {
                        console.log('Success:', data);
                        alert('Thank you for your interest! We will contact you soon.');
                        leadModal.style.display = 'none';
                        leadForm.reset();
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('There was an error submitting your information. Please try again later.');
                    });
                });
            }

            window.addEventListener('load', () => {
                try {
                    const config = localStorage.getItem('archiver-config');
                    if (config) {
                        const parsedConfig = JSON.parse(config);
                        const platforms = document.getElementById('platforms');
                        if (platforms && parsedConfig.platforms) {
                            parsedConfig.platforms.forEach(platform => {
                                const option = platforms.querySelector(`option[value="${platform}"]`);
                                if (option) option.selected = true;
                            });
                        }
                        if (document.getElementById('schedule') && parsedConfig.schedule) {
                            document.getElementById('schedule').value = parsedConfig.schedule;
                        }
                        if (document.getElementById('tags') && parsedConfig.tags) {
                            document.getElementById('tags').value = parsedConfig.tags;
                        }
                    }
                } catch (error) {
                    console.error('Error loading configuration:', error);
                }
            });

            // Close modal when clicking outside
            leadModal.addEventListener('click', (e) => {
                if (e.target === leadModal) {
                    leadModal.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
